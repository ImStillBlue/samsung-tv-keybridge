[project]
name = "theatre-controller"
version = "0.2.0"
description = "Explicitly armed Theatre controller with standby-safe recovery"
requires-python = ">=3.12,<3.15"
dependencies = [
    "anyio==4.11.0",
    "pydantic==2.12.3",
    "typer==0.20.0",
    "click==8.1.8",
    "httpx2[http2,brotli,zstd]==2.16.0",
    "samsung-tv-root==0.0.8",
]

[project.scripts]
theatre-controller = "theatre.main:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2", "basedpyright==1.32.1"]

[tool.uv.sources]
samsung-tv-root = { path = ".cache/upstream" }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["theatre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
include = ["theatre", "tests"]
extraPaths = [".cache/upstream/src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "SLF001"]
